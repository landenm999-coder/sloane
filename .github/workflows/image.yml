# Builds the production image for linux/arm64 -- the Oracle box's architecture
# -- whenever something that goes into it changes, then smoke-tests it.
#
# The test job runs on setup-python, which cannot catch a Dockerfile that no
# longer builds or a base-image bump whose wheels do not exist for aarch64.
# This is the only place that is checked before the box finds out.

name: image

on:
  push:
    paths: [Dockerfile, .dockerignore, requirements.txt, compose.yml, "sloane/**", ".github/workflows/image.yml"]
  pull_request:
    paths: [Dockerfile, .dockerignore, requirements.txt, compose.yml, "sloane/**", ".github/workflows/image.yml"]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: sloane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -e
          run() { docker run --rm --platform linux/arm64 sloane:ci "$@"; }
          run python -c "import sloane.main, sloane.jobs.scheduler, sloane.school.sync; print('imports ok')"
          # The CLI is installed globally as root and run as the non-root
          # user; this proves it resolves and can write its config.
          run sh -c 'id -un && claude --version'
          run sh -c 'touch "$HOME/.claude/probe" && echo "claude config dir writable"'
          run sh -c 'touch /var/lib/sloane/models/probe && echo "model cache writable"'
          run sh -c 'test -f state.example.md && ls sql/ && echo "seed + migrations present"'
          run sh -c 'ffmpeg -hide_banner -encoders | grep -q libopus && echo "ffmpeg can make voice notes"'
          # The local (British) voice: piper-tts and its bundled espeak load on arm64.
          run python -c "from piper import PiperVoice; from piper.download_voices import download_voice; print('piper ok')"
          # The British voice end to end, as the box first uses it: fetched by
          # name, loaded, spoken, and made into an OGG/Opus voice note.
          run sh -c 'python - <<"PY"
          import asyncio
          from sloane.config import Settings
          from sloane.providers.tts import PiperTTS

          async def main():
              tts = PiperTTS(Settings(piper_voice="en_GB-cori-medium", embed_cache_dir="/tmp/voices"))
              tts._timeout = 600  # emulated arm64 is slow; the box is not
              assert await tts.warm(), "the voice did not fetch or load"
              audio = await tts.synthesize("Good morning. Two things are due today.")
              open("/tmp/voice.wav", "wb").write(audio.wav)
              print(f"piper spoke {len(audio.wav)} bytes in {audio.usage.latency_ms} ms (emulated)")

          asyncio.run(main())
          PY
          ffmpeg -loglevel error -i /tmp/voice.wav -c:a libopus /tmp/voice.ogg && test -s /tmp/voice.ogg && echo "voice note made"'
