<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0f11">
<title>Sloane · Sign in</title>
<link rel="icon" href="/app/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/app/static/icon-180.png">
<link rel="manifest" href="/app/static/manifest.json">
<link rel="stylesheet" href="/app/static/app.css">
</head>
<body class="login">
<main class="door">
  <div class="orb" data-state="idle" aria-hidden="true">
    <span class="glow"></span>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="g-door" cx="42%" cy="38%" r="65%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="currentColor" stop-opacity=".95"/><stop offset="1" stop-color="currentColor" stop-opacity=".15"/></radialGradient></defs>
      <g class="spin r1"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width=".8" stroke-dasharray=".7 3.3" opacity=".55"/></g>
      <g class="spin r2"><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="54 72" stroke-linecap="round" opacity=".8"/></g>
      <circle cx="50" cy="50" r="31" fill="none" stroke="currentColor" stroke-width=".6" opacity=".35"/>
      <g class="spin r3"><circle cx="50" cy="50" r="31" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="14 181" stroke-linecap="round"/></g>
      <circle class="core" cx="50" cy="50" r="17" fill="url(#g-door)"/>
      <circle cx="50" cy="50" r="21" fill="none" stroke="currentColor" stroke-width=".5" opacity=".5"/>
    </svg>
  </div>
  <h1>Sloane</h1>
  <p>Private. Enter your dashboard password (DASHBOARD_TOKEN in her .env).</p>
  <!--MESSAGE-->
  <form method="post" action="/app/login">
    <label for="token">Password</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
    <button type="submit" class="btn primary">Sign in</button>
  </form>
</main>
</body>
</html>
